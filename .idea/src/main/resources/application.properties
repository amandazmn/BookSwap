spring.application.name=bookswap-api
server.port=8080

# ---------- Banco H2 em memória (desenvolvimento e testes - RNF03) ----------
spring.datasource.url=jdbc:h2:mem:bookswap;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Console web do H2: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:bookswap)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- JPA / Hibernate ----------
# As tabelas são criadas a partir das entidades @Entity
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Carrega src/main/resources/data.sql depois que o Hibernate cria as tabelas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=embedded
spring.sql.init.encoding=UTF-8

# Mensagens de erro e datas em formato legível
spring.jackson.serialization.write-dates-as-timestamps=false
