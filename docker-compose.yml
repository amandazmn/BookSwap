services:
  postgres:
    image: postgres:16
    container_name: bookswap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookswap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - bookswap-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookswap"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bookswap-postgres-data:
